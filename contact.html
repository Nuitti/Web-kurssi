<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Kuivasjärven Rantasaunat</title>
</head>

<body>

    
        <header class="top-bar">
            <h1>Kuivasjärven Rantasaunat</h1>

        <nav>
            <a href="index.html">Etusivu</a>
            <a href="listing.html">Saunat</a>
            <a href="contact.html">Yhteystiedot</a>
            <a href="about.html">Tietoa meistä</a>
        </nav>
    </header>

    <main>
    
        <section class="contact-form">

    <h2>Ota yhteyttä</h2>

    <form id="contactForm" novalidate>

        <label for="nimi">Nimi</label>
        <input
            type="text"
            id="nimi"
            required
            aria-describedby="nimiError">
        <span id="nimiError" class="error-message"></span>

        <label for="sahkoposti">Sähköposti</label>
        <input
            type="email"
            id="sahkoposti"
            aria-describedby="emailError">

        <span
            id="emailError"
            class="error-message">
        </span>

        <label for="puhelin">Puhelinnumero</label>
        <input
            type="tel"
            id="puhelin"
            aria-describedby="puhelinError">
        <span id="puhelinError" class="error-message"></span>

        <label for="aihe">Aihe</label>
        <input
            type="text"
            id="aihe"
            required
            aria-describedby="aiheError">
        <span id="aiheError" class="error-message"></span>

        <label for="viesti">Viesti</label>
        <textarea
            id="viesti"
            rows="6"
            required
            aria-describedby="viestiError"></textarea>
        <span id="viestiError" class="error-message"></span>
        
        <button type="submit">
            Lähetä viesti
        </button>

        <p id="formStatus" role="status"></p>

    </form>

</section>

    </main>

    <footer>
        <p>&copy; 2026 Kuivasjärven Rantasaunat</p>
    </footer>

</body>
</html>
