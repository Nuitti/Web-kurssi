<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuivasjärven Rantasaunat</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>


<body>

    <div class="top-bar">
            <h1>Kuivasjärven Rantasaunat</h1>

        <nav>
            <a href="index.html">Etusivu</a>
            <a href="listing.html">Saunat</a>
            <a href="contact.html">Yhteystiedot</a>
            <a href="about.html">Tietoa meistä</a>
        </nav>
    </div>

<section class="sauna-cards">
    <div class="sauna-card-container">
        <h2>Savusauna</h2>
        <div class="sauna-card smoke-sauna"></div>
        <a href="listing.html#savusauna" class="sauna-btn">
            Katso lisää
        </a>
    </div>

    <div class="sauna-card-container">
        <h2>Rantasauna</h2>
        <div class="sauna-card beach-sauna"></div>
        <a href="listing.html#rantasauna" class="sauna-btn">
            Katso lisää
        </a>
    </div>

    <div class="sauna-card-container">
        <h2>Mökkisauna</h2>
        <div class="sauna-card cottage-sauna"></div>
        <a href="listing.html#mokkisauna" class="sauna-btn">
            Katso lisää
        </a>
    </div>

    <button popovertarget="infoPopover">
        Lisätietoa
    </button>

    <div id="infoPopover" popover>
        Kuivasjärven Rantasaunat
    </div>

</section>

    <div class="search-box">

    <h3>Etsi vapaat ajat</h3>

    <input type="date" id="dateSearch">

    <button id="searchBtn">
        Hae
    </button>
    
    <p id="statusMessage" role="status" aria-live="polite"></p>

</div>

    <div id="searchResults"></div>

    <section class="calendar-section">
    <div class="calendar-header">
        <button id="prevWeek">←</button>
        <h2>Tämän viikon vapaat ajat</h2>
        <button id="nextWeek">→</button>
    </div>


<div class="table-wrapper">
    <table class="calendar">
        <thead>
           <tr class="date-row">
                <th></th>
                <th id="date0"></th>
                <th id="date1"></th>
                <th id="date2"></th>
                <th id="date3"></th>
                <th id="date4"></th>
                <th id="date5"></th>
                <th id="date6"></th>
            </tr>

            <tr class="weekday-row">
                <th>Sauna</th>
                <th>Ma</th>
                <th>Ti</th>
                <th>Ke</th>
                <th>To</th>
                <th>Pe</th>
                <th>La</th>
                <th>Su</th>
            </tr>
        </thead>

        <tbody id="calendarBody">
        </tbody>
    </table>
</div>
</section>


<section id="varauslomake">

    <h2>Tee varaus</h2>

    <form>

        <label for="sauna">Sauna</label>
        <select id="sauna">
            <option>Savusauna</option>
            <option>Rantasauna</option>
            <option>Mökkisauna</option>
        </select>

        <label for="paivamaara">Päivämäärä</label>
        <input type="date" id="paivamaara">

        <label for="nimi">Nimi</label>
        <input type="text" id="nimi" required>

        <label for="sahkoposti">Sähköposti</label>
        <input type="email" id="sahkoposti" required>

        <label for="puhelin">Puhelin</label>
        <input type="tel" id="puhelin" required>


        <button type="submit">
            Lähetä varaus
        </button>

        <p
            id="varausStatus"
            role="status"
            aria-live="polite">
        </p>

    </form>

    <section class="varaushaku">

    <h3>Hae varauksesi</h3>

    <label for="asiakasnumero">
        Asiakasnumero
    </label>

    <input
        type="text"
        id="asiakasnumero">

    <button
        type="button"
        id="haeVaraus">
        Hae
    </button>

    <p
        id="haeTulos"
        role="status"
        aria-live="polite">
    </p>

    </section>

    </section>
  
    <footer>
        <p>&copy; 2026 Kuivasjärven Rantasaunat</p>
    </footer>

</body>
</html>
